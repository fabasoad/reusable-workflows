---
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      install-command:
        description: Command that installs dependencies
        required: false
        default: "make install"
        type: string
      lint-command:
        description: Command that runs linting
        required: false
        default: "make lint"
        type: string
      python-version-file:
        description: |
          File containing the version Spec of the version to use. Examples:
          pyproject.toml, .python-version, .tool-versions.
        required: false
        default: "pyproject.toml"
        type: string

defaults:
  run:
    shell: sh

jobs:
  unit-tests-all:
    name: All
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v7
        with:
          persist-credentials: "false"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "${{ inputs.python-version-file }}"

      - name: Install dependencies
        env:
          INPUT_INSTALL_COMMAND: "${{ inputs.install-command }}"
        run: ${INPUT_INSTALL_COMMAND}

      - name: Perform linting
        env:
          INPUT_LINT_COMMAND: "${{ inputs.lint-command }}"
        run: ${INPUT_LINT_COMMAND}
