---
on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      github-token:
        description: GitHub token for authenticated requests
        required: false
    inputs:
      dast-run:
        description: Whether to run DAST or not. Defaults to true.
        required: false
        default: true
        type: boolean
      target-url:
        description: Target URL to perform DAST analysis.
        required: false
        default: ""
        type: string
      ghas-category:
        description: String used by GHAS for matching analyses.
        required: false
        default: "default"
        type: string

jobs:
  nuclei:
    name: Nuclei
    if: inputs.dast-run && inputs.target-url != ''
    runs-on: macos-latest
    steps:
      - name: Perform scanning
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          config: |
            target: ["${{ inputs.target-url }}"]
            severity: ["critical", "high", "medium", "low"]
            stats: true
            sarif-export: nuclei.sarif
            validate: true
          token: ${{ secrets.github-token || github.token }}
      - name: Upload SARIF as artifact
        if: always() && hashFiles('nuclei.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nuclei.sarif
          path: nuclei.sarif
      - name: Upload to GHAS
        if: always() && hashFiles('nuclei.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "nuclei-${{ inputs.ghas-category }}"
          sarif_file: nuclei.sarif
  zap:
    name: ZAP
    if: inputs.dast-run && inputs.target-url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Perform scanning
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: "${{ inputs.target-url }}"
          allow_issue_writing: "false"
          artifact_name: report-zap
  dastardly:
    name: Dastardly
    if: inputs.dast-run && inputs.target-url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Perform scanning
        uses: PortSwigger/dastardly-github-action@f72f38f8b4ac8ed59c69854cc77eb9d53e50e78b # v1.0.0
        with:
          target-url: "${{ inputs.target-url }}"
      - name: Upload report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: report-dastardly
          path: dastardly-report.xml
  pentest-tools:
    name: Pentest Tools
    if: inputs.dast-run && inputs.target-url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Perform scanning
        id: pentesttools-scan
        uses: pentesttoolscom/pentesttools-github-action@ece54ee3353e11194715688b9af3b708801fa3f6
        with:
          target: "${{ inputs.target-url }}"
          fail: "high"
      - name: Upload report as artifact
        if: steps.pentesttools-scan.outputs.result != ''
        uses: actions/upload-artifact@v7
        with:
          name: report.ptt
          path: "${{ steps.pentesttools-scan.outputs.result }}"
