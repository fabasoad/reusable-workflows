---
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # Code Scanning
      code-scanning:
        description: Whether to run SAST analysis or not. Defaults to true.
        required: false
        default: false
        type: boolean
      code-scanning-build-mode:
        description: |
          Available build modes will differ based on the language being analyzed.
          One of: none, autobuild, manual.
        required: false
        default: "none"
        type: string
      code-scanning-build-command:
        description: |
          The build command to create the project that is required if the language
          is a built language, such as Go or Java. It runs only in case "code-scanning-build-mode"
          is set to "manual".
        required: false
        default: "make build"
        type: string
      code-scanning-languages:
        description: |
          A comma-separated list of languages for SAST analysis. Defaults to
          "actions".
        required: false
        default: "actions"
        type: string

      # PR review
      dependency-review:
        description: |
          Whether to run Dependency review analysis or not. Defaults to true if
          it workflow is trigger by pull_request event, otherwise - false.
        required: false
        default: ${{ github.event_name == 'pull_request' }}
        type: boolean

      # Container Image
      image:
        description: Whether to run Image analysis or not. Defaults to false.
        required: false
        default: false
        type: boolean
      image-artifact-name:
        description: |
          The artifact name that was uploaded by previous build job. In fact the
          result of "docker image save" or "podman save" command. Defaults to "".
        required: false
        default: ""
        type: string
      image-severity-threshold:
        description: |
          Fail a pipeline if a vulnerability is found with a severity >= the
          given severity. One of: negligible, low, medium, high, critical.
        required: false
        default: medium
        type: string

      # SCA
      sca:
        description: Whether to run SCA analysis or not. Defaults to true.
        required: false
        default: false
        type: boolean
      sca-path:
        description: Path to the directory for SCA. Defaults to "".
        required: false
        default: "."
        type: string
      sca-severity-threshold:
        description: |
          Fail a pipeline if a vulnerability is found with a severity >= the
          given severity. One of: negligible, low, medium, high, critical.
        required: false
        default: medium
        type: string
      sca-vendor:
        description: "Vendor to run SCA. Possible values: grype."
        required: false
        default: grype
        type: string

      # IaC
      iac:
        description: Whether to run IaC analysis or not. Defaults to false.
        required: false
        default: false
        type: boolean
      iac-tf-vars:
        description: Path to TF vars file. Defaults to "terraform/vars.auto.tfvars".
        required: false
        default: "terraform/vars.auto.tfvars"
        type: string

      # Common
      ghas-category:
        description: String used by GHAS for matching analyses. Defaults to "default".
        required: false
        default: "default"
        type: string
      versions-file:
        description: Path to the file with tool versions, e.g. .tool-versions
        required: false
        default: ".tool-versions"
        type: string

jobs:
  code-scanning:
    name: Code Scanning
    if: inputs.code-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEFAULT_JAVA_VERSION: "27"
      DEFAULT_GRADLE_VERSION: "9.9.2"
      DEFAULT_NODE_VERSION: "26"
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      # Start: TypeScript
      - name: Prepare TypeScript metadata
        if: contains(format(',{0},', inputs.code-scanning-languages), ',typescript,')
        id: typescript-metadata
        env:
          INPUT_VERSIONS_FILE: "${{ inputs.versions-file }}"
        run: |
          node_version="${DEFAULT_NODE_VERSION}"
          if [ "${INPUT_VERSIONS_FILE%*.tool-versions}" != "${INPUT_VERSIONS_FILE}" ]; then
            node_version_temp="$(grep -Eo 'nodejs [a-z0-9.-]+' "${INPUT_VERSIONS_FILE}" | cut -d ' ' -f 2)"
            if [ -n "${node_version_temp}" ]; then
              node_version="${node_version_temp}"
            fi
          fi
          echo "node-version=${node_version}" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        if: contains(format(',{0},', inputs.code-scanning-languages), ',typescript,')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ steps.typescript-metadata.outputs.node-version }}"
      # End: TypeScript
      # Start: Java
      - name: Prepare Java metadata
        if: contains(format(',{0},', inputs.code-scanning-languages), ',java,')
        id: java-metadata
        env:
          INPUT_VERSIONS_FILE: "${{ inputs.versions-file }}"
        run: |
          gradle_version="${DEFAULT_GRADLE_VERSION}"
          java_version="${DEFAULT_JAVA_VERSION}"
          if [ "${INPUT_VERSIONS_FILE%*.tool-versions}" != "${INPUT_VERSIONS_FILE}" ]; then
            gradle_version_temp="$(grep -Eo 'gradle [a-z0-9.-]+' "${INPUT_VERSIONS_FILE}" | cut -d ' ' -f 2)"
            if [ -n "${gradle_version_temp}" ]; then
              gradle_version="${gradle_version_temp}"
            fi
            java_version_temp="$(grep -Eo 'java [a-z0-9.-]+' "${INPUT_VERSIONS_FILE}" | cut -d '-' -f 2)"
            if [ -n "${java_version_temp}" ]; then
              java_version="${java_version_temp}"
            fi
          fi
          echo "gradle-version=${gradle_version}" >> "$GITHUB_OUTPUT"
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"
      - name: Setup Java
        if: contains(format(',{0},', inputs.code-scanning-languages), ',java,')
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "${{ steps.java-metadata.outputs.java-version }}"
      - name: Setup Gradle
        if: contains(format(',{0},', inputs.code-scanning-languages), ',java,')
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "${{ steps.java-metadata.outputs.gradle-version }}"
          add-job-summary: "never"
          artifact-retention-days: "3"
      # End: Java
      - name: Initialize
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: "${{ inputs.code-scanning-languages }}"
          build-mode: "${{ inputs.code-scanning-build-mode }}"
          config: |
            paths-ignore:
              - dist/index.js
      - name: Autobuild
        if: ${{ inputs.code-scanning-build-mode == 'autobuild' }}
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Manual build
        if: ${{ inputs.code-scanning-build-mode == 'manual' }}
        env:
          # It is used in fabasoad/pojo project
          SKIP_FINALIZE: true
        run: "${{ inputs.code-scanning-build-command }}"
      - name: Perform analysis
        id: code-scanning
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "code-scanning-${{ inputs.ghas-category }}"
  sca-grype:
    name: SCA (Grype)
    if: inputs.sca && inputs.sca-vendor == 'grype'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Setup Grype
        id: setup-grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      - name: Perform analysis
        id: sca
        env:
          INPUT_PATH: "${{ inputs.sca-path }}"
          INPUT_SEVERITY_THRESHOLD: "${{ inputs.sca-severity-threshold }}"
        run: |
          sarif_path="${RUNNER_TEMP}/$(date +%s).sarif"
          echo "sarif-path=${sarif_path}" >> "$GITHUB_OUTPUT"
          ${{ steps.setup-grype.outputs.cmd }} \
            "dir:${INPUT_PATH}" \
            --by-cve \
            --fail-on="${INPUT_SEVERITY_THRESHOLD}" \
            --output table \
            --output "sarif=${sarif_path}"
      - name: Show results
        if: always()
        shell: python
        env:
          SARIF_FILE: "${{ steps.sca.outputs.sarif-path }}"
          SUMMARY_TITLE: "Grype SCA scan results"
        run: |
          import json
          import os
          import re
          import sys
          from collections import Counter

          SEVERITY_ORDER = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]


          def field(text, name):
              match = re.search(rf"^{re.escape(name)}:[ \t]*(.*)$", text or "", re.M)
              return match.group(1).strip() if match else ""


          def main():
              sarif_file = os.environ.get("SARIF_FILE", "")
              title = os.environ.get("SUMMARY_TITLE", "Grype scan results")
              summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")

              def write_summary(text):
                  if summary_file:
                      with open(summary_file, "a", encoding="utf-8") as handle:
                          handle.write(text)

              if not sarif_file or not os.path.isfile(sarif_file):
                  print(f"No Grype SARIF report found at '{sarif_file}'; nothing to show.")
                  write_summary(f"## {title}\n\nNo SARIF report was produced.\n")
                  return

              with open(sarif_file, encoding="utf-8") as handle:
                  report = json.load(handle)

              findings = []
              for run in report.get("runs", []):
                  driver = run.get("tool", {}).get("driver", {})
                  rules = {}
                  for rule in driver.get("rules", []):
                      help_text = rule.get("help", {}).get("text", "")
                      short = rule.get("shortDescription", {}).get("text", "")
                      vuln = field(help_text, "Vulnerability")
                      if not vuln:
                          match = re.match(r"^(\S+)\s", short)
                          vuln = match.group(1) if match else rule.get("id", "")
                      severity = field(help_text, "Severity")
                      if not severity:
                          match = re.search(r"\b\w+ vulnerability\b", short)
                          severity = match.group(0).split()[0] if match else "unknown"
                      rules[rule.get("id", "")] = {
                          "package": field(help_text, "Package"),
                          "version": field(help_text, "Version"),
                          "fixed": field(help_text, "Fix Version"),
                          "type": field(help_text, "Type"),
                          "vulnerability": vuln,
                          "severity": severity.capitalize(),
                      }
                  for result in run.get("results", []):
                      finding = dict(rules.get(result.get("ruleId", ""), {}))
                      if not finding.get("package"):
                          match = re.search(
                              r"vulnerability in \S+ package: (.+), version (\S+)",
                              result.get("message", {}).get("text", ""),
                          )
                          if match:
                              finding["package"] = match.group(1)
                              finding["version"] = match.group(2)
                          finding.setdefault("vulnerability", result.get("ruleId", ""))
                          finding.setdefault("severity", "Unknown")
                      finding.setdefault("fixed", "")
                      finding.setdefault("type", "")
                      findings.append(finding)

              counts = Counter(f["severity"] for f in findings)
              ordered = [s for s in SEVERITY_ORDER if s in counts]
              ordered += [s for s in counts if s not in SEVERITY_ORDER]
              counts_text = ", ".join(f"{s}: {counts[s]}" for s in ordered)

              print(f"Grype findings: {len(findings)} total ({counts_text or 'none'})")

              def esc(value):
                  return value.replace("|", "\\|")

              lines = [f"## {title}", "", f"**Total findings:** {len(findings)}", ""]
              if findings:
                  lines += ["| Severity | Count |", "| --- | --- |"]
                  lines += [f"| {s} | {counts[s]} |" for s in ordered]
                  lines += [
                      "",
                      "| Package | Installed | Fixed in | Type | Vulnerability | Severity |",
                      "| --- | --- | --- | --- | --- | --- |",
                  ]
                  lines += [
                      "| {} | {} | {} | {} | {} | {} |".format(
                          esc(f["package"]),
                          esc(f["version"]),
                          esc(f["fixed"]),
                          esc(f["type"]),
                          esc(f["vulnerability"]),
                          esc(f["severity"]),
                      )
                      for f in findings
                  ]
              lines.append("")
              write_summary("\n".join(lines))


          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:  # never fail the job from the reporting step
                  print(f"::warning::Could not render Grype results: {error}")
              sys.exit(0)
      - name: Upload to GHAS
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "sca-${{ inputs.ghas-category }}"
          sarif_file: "${{ steps.sca.outputs.sarif-path }}"
  #  sca-osv-scanner:
  #    name: SCA (OSV Scanner)
  #    if: inputs.sca && inputs.sca-vendor == 'osv-scanner'
  #    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.1.0
  dependency-review:
    name: Dependency review
    if: inputs.dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Perform review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          config-file: "fabasoad/reusable-workflows/.github/dependency-review-config.yml@main"
          external-repo-token: "${{ github.token }}"
  image:
    name: Image
    if: inputs.image && inputs.image-artifact-name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download artifact
        id: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ inputs.image-artifact-name }}"
      - name: Setup Grype
        id: setup-grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      - name: Perform analysis
        id: image
        env:
          INPUT_SEVERITY_THRESHOLD: "${{ inputs.image-severity-threshold }}"
        run: |
          sarif_path="${RUNNER_TEMP}/$(date +%s).sarif"
          echo "sarif-path=${sarif_path}" >> "$GITHUB_OUTPUT"
          ${{ steps.setup-grype.outputs.cmd }} \
            "docker-archive:${{ steps.download-artifact.outputs.download-path }}/${{ inputs.image-artifact-name }}.tar" \
            --by-cve \
            --fail-on="${INPUT_SEVERITY_THRESHOLD}" \
            --output table \
            --output "sarif=${sarif_path}"
      - name: Show results
        if: always()
        shell: python
        env:
          SARIF_FILE: "${{ steps.image.outputs.sarif-path }}"
          SUMMARY_TITLE: "Grype image scan results"
        run: |
          import json
          import os
          import re
          import sys
          from collections import Counter

          SEVERITY_ORDER = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]


          def field(text, name):
              match = re.search(rf"^{re.escape(name)}:[ \t]*(.*)$", text or "", re.M)
              return match.group(1).strip() if match else ""


          def main():
              sarif_file = os.environ.get("SARIF_FILE", "")
              title = os.environ.get("SUMMARY_TITLE", "Grype scan results")
              summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")

              def write_summary(text):
                  if summary_file:
                      with open(summary_file, "a", encoding="utf-8") as handle:
                          handle.write(text)

              if not sarif_file or not os.path.isfile(sarif_file):
                  print(f"No Grype SARIF report found at '{sarif_file}'; nothing to show.")
                  write_summary(f"## {title}\n\nNo SARIF report was produced.\n")
                  return

              with open(sarif_file, encoding="utf-8") as handle:
                  report = json.load(handle)

              findings = []
              for run in report.get("runs", []):
                  driver = run.get("tool", {}).get("driver", {})
                  rules = {}
                  for rule in driver.get("rules", []):
                      help_text = rule.get("help", {}).get("text", "")
                      short = rule.get("shortDescription", {}).get("text", "")
                      vuln = field(help_text, "Vulnerability")
                      if not vuln:
                          match = re.match(r"^(\S+)\s", short)
                          vuln = match.group(1) if match else rule.get("id", "")
                      severity = field(help_text, "Severity")
                      if not severity:
                          match = re.search(r"\b\w+ vulnerability\b", short)
                          severity = match.group(0).split()[0] if match else "unknown"
                      rules[rule.get("id", "")] = {
                          "package": field(help_text, "Package"),
                          "version": field(help_text, "Version"),
                          "fixed": field(help_text, "Fix Version"),
                          "type": field(help_text, "Type"),
                          "vulnerability": vuln,
                          "severity": severity.capitalize(),
                      }
                  for result in run.get("results", []):
                      finding = dict(rules.get(result.get("ruleId", ""), {}))
                      if not finding.get("package"):
                          match = re.search(
                              r"vulnerability in \S+ package: (.+), version (\S+)",
                              result.get("message", {}).get("text", ""),
                          )
                          if match:
                              finding["package"] = match.group(1)
                              finding["version"] = match.group(2)
                          finding.setdefault("vulnerability", result.get("ruleId", ""))
                          finding.setdefault("severity", "Unknown")
                      finding.setdefault("fixed", "")
                      finding.setdefault("type", "")
                      findings.append(finding)

              counts = Counter(f["severity"] for f in findings)
              ordered = [s for s in SEVERITY_ORDER if s in counts]
              ordered += [s for s in counts if s not in SEVERITY_ORDER]
              counts_text = ", ".join(f"{s}: {counts[s]}" for s in ordered)

              print(f"Grype findings: {len(findings)} total ({counts_text or 'none'})")

              def esc(value):
                  return value.replace("|", "\\|")

              lines = [f"## {title}", "", f"**Total findings:** {len(findings)}", ""]
              if findings:
                  lines += ["| Severity | Count |", "| --- | --- |"]
                  lines += [f"| {s} | {counts[s]} |" for s in ordered]
                  lines += [
                      "",
                      "| Package | Installed | Fixed in | Type | Vulnerability | Severity |",
                      "| --- | --- | --- | --- | --- | --- |",
                  ]
                  lines += [
                      "| {} | {} | {} | {} | {} | {} |".format(
                          esc(f["package"]),
                          esc(f["version"]),
                          esc(f["fixed"]),
                          esc(f["type"]),
                          esc(f["vulnerability"]),
                          esc(f["severity"]),
                      )
                      for f in findings
                  ]
              lines.append("")
              write_summary("\n".join(lines))


          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:  # never fail the job from the reporting step
                  print(f"::warning::Could not render Grype results: {error}")
              sys.exit(0)
      - name: Upload to GHAS
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "image-${{ inputs.ghas-category }}"
          sarif_file: "${{ steps.image.outputs.sarif-path }}"
  iac:
    name: IaC
    if: inputs.iac
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - name: Perform analysis
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          hide-progress: "false"
          exit-code: "2"
          format: "sarif"
          output: "iac-${{ inputs.ghas-category }}.sarif"
          ignore-unfixed: "true"
          tf-vars: "${{ inputs.iac-tf-vars }}"
          trivy-config: "trivy.yaml"
      - name: Upload to GHAS
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "iac-${{ inputs.ghas-category }}"
          sarif_file: "iac-${{ inputs.ghas-category }}.sarif"
