---
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      ref:
        description: ref (refs/heads/main)
        default: ${{ github.ref }}
        required: false
        type: string
      ref-name:
        description: ref_name (main)
        default: ${{ github.ref_name }}
        required: false
        type: string
      bump-tags:
        description: Whether to move semantic tags or not.
        default: true
        required: false
        type: boolean

jobs:
  create:
    name: Create
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: "${{ inputs.ref }}"
      - name: Create release
        uses: elgohr/Github-Release-Action@c5ea99036abb741a89f8bf1f2cd7fba845e3313a # v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: ${{ inputs.ref-name }}
          tag: ${{ inputs.ref-name }}
      - name: Bump tags
        if: inputs.bump-tags
        uses: fischerscode/tagger@5ca3fa63ce3003fb7183cae547644b29f3b632be # v0.2.0
        with:
          prefix: v
